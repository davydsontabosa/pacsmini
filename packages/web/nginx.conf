# ─────────────────────────────────────────────────────────────────────────────
# PACS Mini — Nginx Configuration
# Serve o SPA React + proxy reverso para o backend
# ─────────────────────────────────────────────────────────────────────────────

server {
  listen 80;
  server_name _;

  root  /usr/share/nginx/html;
  index index.html;

  # ── Segurança: HTTP headers ─────────────────────────────────────────────────
  add_header X-Frame-Options           "SAMEORIGIN"           always;
  add_header X-Content-Type-Options    "nosniff"              always;
  add_header X-XSS-Protection          "1; mode=block"        always;
  add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Content-Security-Policy moderado para aplicação React + DICOM
  add_header Content-Security-Policy
    "default-src 'self'; \
     script-src 'self' 'unsafe-inline' 'unsafe-eval'; \
     style-src 'self' 'unsafe-inline'; \
     img-src 'self' data: blob: http: https:; \
     connect-src 'self' http: https: ws: wss:; \
     font-src 'self' data:; \
     frame-ancestors 'none';" always;

  # ── Compressão Gzip ──────────────────────────────────────────────────────────
  gzip on;
  gzip_vary         on;
  gzip_proxied      any;
  gzip_comp_level   6;
  gzip_min_length   1024;
  gzip_types
    text/plain text/css text/xml text/javascript
    application/json application/javascript application/x-javascript
    application/xml application/xml+rss application/atom+xml
    image/svg+xml;

  # ── Health check endpoint ────────────────────────────────────────────────────
  location = /health.txt {
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  # ── Assets estáticos com cache longo ─────────────────────────────────────────
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
    expires     1y;
    add_header  Cache-Control "public, immutable";
    access_log  off;
  }

  # ── Proxy reverso para o backend (API + Portal público) ─────────────────────
  location /api/ {
    proxy_pass         http://pacs-server:3500;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    # Necessário para streaming de downloads (sem buffer em memória)
    proxy_buffering    off;
  }

  location /portal/ {
    proxy_pass         http://pacs-server:3500;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_buffering    off;
  }

  location /health {
    proxy_pass http://pacs-server:3500;
    proxy_set_header Host $host;
  }

  # ── SPA fallback: todas as rotas → index.html ──────────────────────────────
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # ── Esconder versão do Nginx ──────────────────────────────────────────────────
  server_tokens off;

  # ── Limite de tamanho de upload ───────────────────────────────────────────────
  client_max_body_size 512m;
}
